<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私人助手内测</title><link rel="stylesheet" href="/static/style.css"><script src="/static/pilot.js" defer></script></head><body><aside><a class="brand" href="/">私人助手</a><a href="/memory">记忆与隐私偏好</a><p><a href="/api/export">导出我的资料</a></p></aside><main>
<h1>欢迎来到你的私人空间</h1><p id="notice" role="status"></p>
<form id="login"><label id="invite-label">一次性开通凭据<input id="invite" type="password" autocomplete="off"></label><label>密码<input id="password" type="password" minlength="12" required autocomplete="current-password"></label><button>开通／登录</button></form>
<section id="workspace" hidden><p>模型与发件服务由运营者提供。请先到<a href="/memory">记忆与隐私偏好</a>确认云端处理、自动整理和主动联系。</p>
<fieldset><legend>邮箱验证</legend><label>你的邮箱<input id="email" type="email" autocomplete="email"></label><button id="request-email">发送验证码</button><label>验证码<input id="code" inputmode="numeric" maxlength="6"></label><button id="verify-email">验证邮箱</button></fieldset>
<fieldset><legend>微信</legend><button id="wechat-login">扫码连接微信</button><button id="wechat-refresh">刷新连接状态</button><p id="wechat-state"></p><img id="qr" hidden alt="微信登录二维码" width="256" height="256"><button id="wechat-start">登录完成，启动助手</button></fieldset>
<fieldset><legend>检查简报</legend><button data-test="model">测试模型</button><button data-test="mail">发送测试邮件</button><button data-preview="morning">预览晨报</button><button data-preview="evening">预览晚报</button><pre id="preview"></pre><label><input id="mail-received" type="checkbox">测试邮件已经到达我的邮箱</label><label><input id="preview-approved" type="checkbox">已检查两份预览，同意自动发送</label><button id="activate">启用简报</button><p>默认晨报 08:30，晚报 21:00，采用你的时区。</p></fieldset>
<fieldset><legend>我的用量</legend><button id="usage">刷新用量</button><p>费用是估算值；缺失供应商用量的请求会标为待核对。</p><pre id="usage-text"></pre></fieldset><button id="logout">退出登录</button>
<fieldset><legend>我的知识库与人设</legend><button id="notes-load">加载笔记列表</button><select id="notes-list" aria-label="笔记列表"></select><label>相对路径<input id="note-path" placeholder="04_知识与资源/我的笔记.md"></label><textarea id="note-text" rows="12" aria-label="笔记正文"></textarea><button id="note-save">保存笔记</button><p>可选择 SOUL.md 调整说话风格。修改已有笔记前先从列表加载，避免覆盖另一次编辑。</p></fieldset>
</section></main></body></html>
