[package]
name = "life-assistant-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop companion for your self-hosted Life Assistant"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
