<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活助手</title></head><body><button id="pet" aria-label="展开生活助手"><span id="sprite"></span></button><main hidden><header><strong>生活助手</strong><button id="collapse" aria-label="收起">收起</button></header><nav><button data-tab="chat">对话</button><button data-tab="life">生活</button><button data-tab="history">历史</button><button data-tab="connection">连接</button></nav><p id="status" role="status"></p><section id="connection" hidden><label>服务器地址<input id="endpoint" type="url" placeholder="https://life.example.com"></label><label>一次性配对码<input id="code" type="password" autocomplete="off"></label><button id="pair">配对</button><button id="check">检查连接</button><button id="forget">清除本机连接</button><p>配对码在服务器网页的“桌面与设备”中生成。API Key 和知识库由服务器管理。</p></section><section id="chat"><textarea id="question" rows="4" placeholder="聊一聊，或输入“记一下：……”"></textarea><div class="actions"><button id="send">发送</button><button id="new">新对话</button></div><textarea id="answer" rows="11" readonly aria-label="助手回复"></textarea></section><section id="life" hidden><label>操作<select id="action"><option value="record">记一下</option><option value="journal">查日记</option><option value="plan">查计划</option><option value="morning">看晨报</option><option value="evening">看明日安排</option></select></label><label>发生／安排日期<input id="date" type="date"></label><textarea id="body" rows="4" placeholder="只在记录时填写原文"></textarea><button id="run">执行</button><button id="new-record">开始新记录</button><textarea id="result" rows="8" readonly aria-label="生活查询结果"></textarea></section><section id="history" hidden><button id="refresh">刷新历史</button><div id="history-items"></div></section></main><script type="module" src="/src/main.ts"></script></body></html>
