name: Pilot validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: python -m pip install . httpx==0.28.1
      - run: npm ci --omit=dev
        working-directory: gateway
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/proactive -v
      - run: node --experimental-vm-modules --test openclaw-bridge/test.mjs proactive-bridge/test.mjs proactive-bridge/integration.test.mjs proactive-bridge/feedback.test.mjs proactive-bridge/knowledge.test.mjs proactive-bridge/profile.test.mjs wechat-batching/test.mjs
      - run: python scripts/privacy_scan.py .
      - run: docker build -f deploy/Dockerfile -t life-pilot:ci .
      - run: docker run --rm -i --network none --add-host broker:127.0.0.1 --read-only --tmpfs /tmp:rw,size=512m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --entrypoint python life-pilot:ci - < tests/container_gateway_config.py
      - name: Actual isolated web entrance
        run: |
          docker pull caddy@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
          docker pull cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
          sudo env PYTHONPATH=server "$(command -v python)" scripts/pilot-ingress-check.py --root /tmp/life-pilot-ingress-fixture --image "life-pilot@$(docker image inspect life-pilot:ci --format '{{.Id}}')" --caddy-image caddy@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772 --tunnel-image cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
      - run: python scripts/build_release.py
